<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poblar Base de Datos - El Artesano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .btn-accion {
            margin: 10px 5px;
        }
        .resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .resultado.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .resultado.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .log-item {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .alert-warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Poblar Base de Datos</h1>
        
        <div class="alert-warning">
            <strong>⚠️ ATENCIÓN:</strong> Este script solo debe usarse una vez para crear datos de muestra. 
            Si ya tienes productos o cursos, se agregarán más.
        </div>

        <div class="mb-4">
            <h4>Estado de Firebase:</h4>
            <p id="firebase-status">⏳ Conectando...</p>
        </div>

        <div class="d-flex flex-wrap justify-content-center">
            <button class="btn btn-primary btn-lg btn-accion" onclick="poblarProductos()">
                📦 Crear Productos de Muestra
            </button>
            <button class="btn btn-info btn-lg btn-accion" onclick="poblarCursos()">
                📚 Crear Cursos de Muestra
            </button>
            <button class="btn btn-success btn-lg btn-accion" onclick="poblarTodo()">
                🚀 Crear Todo (Productos + Cursos)
            </button>
            <button class="btn btn-danger btn-lg btn-accion" onclick="limpiarTodo()">
                🗑️ Limpiar Todo
            </button>
        </div>

        <div id="resultado" class="resultado">
            <h5>Resultado:</h5>
            <div id="log"></div>
        </div>

        <div class="mt-4 text-center">
            <a href="index.html" class="btn btn-secondary">← Volver al Sitio</a>
            <a href="admin-panel.html" class="btn btn-warning">⚙️ Panel Admin</a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="/public/js/firebase-init.js"></script>

    <script>
        const resultado = document.getElementById('resultado');
        const log = document.getElementById('log');

        // Verificar conexión a Firebase
        setTimeout(() => {
            if (typeof db !== 'undefined') {
                document.getElementById('firebase-status').innerHTML = '✅ <strong>Conectado a Firebase</strong>';
            } else {
                document.getElementById('firebase-status').innerHTML = '❌ <strong>Error de conexión</strong>';
            }
        }, 1000);

        function mostrarLog(mensaje, tipo = 'info') {
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `<small>${tipo === 'error' ? '❌' : '✅'} ${mensaje}</small>`;
            log.appendChild(item);
        }

        function mostrarResultado(tipo) {
            resultado.className = `resultado ${tipo}`;
            resultado.style.display = 'block';
        }

        // Datos de muestra para productos
        const productosMuestra = [
            {
                name: 'Pan de Campo',

                price: 450,
                imageUrl: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600',
                category: 'Panes',
                stock: 20,
                createdAt: new Date()
            },
            {
                name: 'Medialuna de Manteca',
                description: 'Medialunas artesanales con manteca, crujientes y doradas.',
                price: 180,
                imageUrl: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=600',
                category: 'Facturas',
                stock: 50,
                createdAt: new Date()
            },
            {
                name: 'Tarta de Jamón y Queso',
                description: 'Tarta casera con jamón y queso de primera calidad.',
                price: 850,
                imageUrl: 'https://images.unsplash.com/photo-1619740455993-32e5f752498b?w=600',
                category: 'Tartas',
                stock: 10,
                createdAt: new Date()
            },
            {
                name: 'Empanadas de Carne',
                description: 'Empanadas artesanales jugosas rellenas de carne suave y especias.',
                price: 250,
                imageUrl: 'https://images.unsplash.com/photo-1599974793548-1f368851a3c4?w=600',
                category: 'Empanadas',
                stock: 30,
                createdAt: new Date()
            },
            {
                name: 'Pan Integral',
                description: 'Pan integral con semillas, alto en fibra y nutrientes.',
                price: 520,
                imageUrl: 'https://images.unsplash.com/photo-1586444248902-2f64eddc13df?w=600',
                category: 'Panes',
                stock: 15,
                createdAt: new Date()
            },
            {
                name: 'Croissant',
                description: 'Croissant francés con capas hojaldradas y manteca.',
                price: 320,
                imageUrl: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=600',
                category: 'Facturas',
                stock: 25,
                createdAt: new Date()
            }
        ];

        // Datos de muestra para cursos (videos de YouTube)
        const cursosMuestra = [
            {
                name: 'Panadería Básica',
                description: 'Aprende las técnicas fundamentales de la panadería artesanal desde cero. Incluye recetas de pan blanco, integral y de masa madre.',
                price: 4500,
                thumbnailUrl: 'https://img.youtube.com/vi/Kl5q0vhBMNM/maxresdefault.jpg',
                videoUrl: 'https://www.youtube.com/watch?v=Kl5q0vhBMNM',
                youtubeId: 'Kl5q0vhBMNM',
                duration: '4 semanas',
                lessons: 12,
                level: 'Principiante',
                instructor: 'Chef Master',
                category: 'Panadería',
                published: true,
                createdAt: new Date()
            },
            {
                name: 'Pan de Masa Madre',
                description: 'Domina el arte de la masa madre: desde su creación hasta el horneado perfecto. Aprende a mantener tu starter y crear panes únicos.',
                price: 6800,
                thumbnailUrl: 'https://img.youtube.com/vi/2FVfJTGpXnU/maxresdefault.jpg',
                videoUrl: 'https://www.youtube.com/watch?v=2FVfJTGpXnU',
                youtubeId: '2FVfJTGpXnU',
                duration: '6 semanas',
                lessons: 18,
                level: 'Intermedio',
                instructor: 'Chef Master',
                category: 'Panadería Avanzada',
                published: true,
                createdAt: new Date()
            },
            {
                name: 'Panadería Profesional',
                description: 'Curso completo para profesionales: técnicas avanzadas, recetas exclusivas y secretos del oficio. Incluye certificado.',
                price: 9500,
                thumbnailUrl: 'https://img.youtube.com/vi/V8vP-LkqXOc/maxresdefault.jpg',
                videoUrl: 'https://www.youtube.com/watch?v=V8vP-LkqXOc',
                youtubeId: 'V8vP-LkqXOc',
                duration: '8 semanas',
                lessons: 24,
                level: 'Avanzado',
                instructor: 'Chef Master',
                category: 'Profesional',
                published: true,
                createdAt: new Date()
            },
            {
                name: 'Facturas y Medialunas',
                description: 'Aprende a hacer facturas, medialunas y croissants con la técnica correcta de hojaldrado.',
                price: 3800,
                thumbnailUrl: 'https://img.youtube.com/vi/hY19NK2nBGo/maxresdefault.jpg',
                videoUrl: 'https://www.youtube.com/watch?v=hY19NK2nBGo',
                youtubeId: 'hY19NK2nBGo',
                duration: '3 semanas',
                lessons: 10,
                level: 'Principiante',
                instructor: 'Chef Master',
                category: 'Pastelería',
                published: true,
                createdAt: new Date()
            }
        ];

        // Poblar productos
        async function poblarProductos() {
            log.innerHTML = '';
            mostrarResultado('success');
            mostrarLog('Iniciando creación de productos...', 'info');

            try {
                for (const producto of productosMuestra) {
                    await db.collection('products').add(producto);
                    mostrarLog(`Producto creado: ${producto.name}`, 'success');
                }
                mostrarLog(`✅ ${productosMuestra.length} productos creados exitosamente`, 'success');
            } catch (error) {
                mostrarLog(`Error: ${error.message}`, 'error');
                mostrarResultado('error');
            }
        }

        // Poblar cursos
        async function poblarCursos() {
            log.innerHTML = '';
            mostrarResultado('success');
            mostrarLog('Iniciando creación de cursos...', 'info');

            try {
                for (const curso of cursosMuestra) {
                    await db.collection('courses').add(curso);
                    mostrarLog(`Curso creado: ${curso.name}`, 'success');
                }
                mostrarLog(`✅ ${cursosMuestra.length} cursos creados exitosamente`, 'success');
            } catch (error) {
                mostrarLog(`Error: ${error.message}`, 'error');
                mostrarResultado('error');
            }
        }

        // Poblar todo
        async function poblarTodo() {
            log.innerHTML = '';
            mostrarResultado('success');
            
            try {
                mostrarLog('Creando productos...', 'info');
                await poblarProductos();
                
                mostrarLog('Creando cursos...', 'info');
                await poblarCursos();
                
                mostrarLog('🎉 ¡Base de datos poblada completamente!', 'success');
            } catch (error) {
                mostrarLog(`Error: ${error.message}`, 'error');
                mostrarResultado('error');
            }
        }

        // Limpiar todo
        async function limpiarTodo() {
            if (!confirm('⚠️ ¿Estás seguro? Esto eliminará TODOS los productos y cursos.')) {
                return;
            }

            log.innerHTML = '';
            mostrarResultado('success');
            mostrarLog('Limpiando base de datos...', 'info');

            try {
                // Eliminar productos
                const productosSnapshot = await db.collection('products').get();
                for (const doc of productosSnapshot.docs) {
                    await doc.ref.delete();
                    mostrarLog(`Producto eliminado: ${doc.data().name}`, 'info');
                }

                // Eliminar cursos
                const cursosSnapshot = await db.collection('courses').get();
                for (const doc of cursosSnapshot.docs) {
                    await doc.ref.delete();
                    mostrarLog(`Curso eliminado: ${doc.data().name}`, 'info');
                }

                mostrarLog('✅ Base de datos limpiada', 'success');
            } catch (error) {
                mostrarLog(`Error: ${error.message}`, 'error');
                mostrarResultado('error');
            }
        }
    </script>
</body>
</html>
